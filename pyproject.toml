[project]
name = "sports-news-ai"
version = "0.1.0"
description = "An evidence-grounded, multilingual sports-news platform and Accountability Ledger."
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    "B008",  # Allow Depends() and Query() in FastAPI router definitions
    "E501",  # Allow longer lines in test fixtures and strings
    "UP017", # Allow timezone.utc
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
